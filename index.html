<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carmen Prépa tech 2027</title>
<meta name="apple-mobile-web-app-title" content="Carmen 2027">
<meta name="theme-color" content="#a3122a">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne de tournée (liste chronologique par mois) → fiche lieu avec accès documents en tête, puis rubriques techniques */
:root{
  --bg:#f5f3f3; --surface:#ffffff; --sunk:#efebeb; --ink:#1b1617; --muted:#6c6264; --line:#e4dddd;
  --accent:#a3122a; --accent-ink:#ffffff; --accent-soft:#f7e3e6;
  --ok:#2d7a4f; --ok-soft:#e1f1e7; --warn:#9c5f08; --warn-soft:#fbefd8;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  --t-dates:#eeeaf8; --ti-dates:#7a68b8; --t-docs:#e4edf7; --ti-docs:#4f7fae; --t-general:#e6f0e7; --ti-general:#5b8a62;
  --t-transport:#ebebe9; --ti-transport:#6f6f6b; --t-plateau:#f8e9e1; --ti-plateau:#b5714f; --t-lumiere:#f6f2d8; --ti-lumiere:#9c8728;
  --t-son:#dff1ef; --ti-son:#3f8c86; --t-video:#f3e5f0; --ti-video:#a0628f; --t-habillage:#e3e8fb; --ti-habillage:#4c63c4; --t-contacts:#e8ebf0; --ti-contacts:#607085;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --surface:#1d191a; --sunk:#181415; --ink:#efe9ea; --muted:#a69b9d; --line:#342c2e;
  --accent:#f06a7e; --accent-ink:#1c0c10; --accent-soft:#3b1d23;
  --ok:#6cc896; --ok-soft:#18301f; --warn:#e6b052; --warn-soft:#382a12; color-scheme:dark;
  --t-dates:#28253a; --ti-dates:#b5a6ef; --t-docs:#1f2a36; --ti-docs:#8fb6dd; --t-general:#1f2e25; --ti-general:#93c39b;
  --t-transport:#272727; --ti-transport:#b4b4ae; --t-plateau:#33261e; --ti-plateau:#e3a283; --t-lumiere:#2f2c1b; --ti-lumiere:#d6c46a;
  --t-son:#1b302e; --ti-son:#7cc6bf; --t-video:#30212c; --ti-video:#d39ac4; --t-habillage:#212842; --ti-habillage:#a3b4f2; --t-contacts:#242a32; --ti-contacts:#9fb0c5}}
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1d191a; --sunk:#181415; --ink:#efe9ea; --muted:#a69b9d; --line:#342c2e;
  --accent:#f06a7e; --accent-ink:#1c0c10; --accent-soft:#3b1d23;
  --ok:#6cc896; --ok-soft:#18301f; --warn:#e6b052; --warn-soft:#382a12; color-scheme:dark;
  --t-dates:#28253a; --ti-dates:#b5a6ef; --t-docs:#1f2a36; --ti-docs:#8fb6dd; --t-general:#1f2e25; --ti-general:#93c39b;
  --t-transport:#272727; --ti-transport:#b4b4ae; --t-plateau:#33261e; --ti-plateau:#e3a283; --t-lumiere:#2f2c1b; --ti-lumiere:#d6c46a;
  --t-son:#1b302e; --ti-son:#7cc6bf; --t-video:#30212c; --ti-video:#d39ac4; --t-habillage:#212842; --ti-habillage:#a3b4f2; --t-contacts:#242a32; --ti-contacts:#9fb0c5}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1040px;margin:0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}

/* En-tête */
.top{padding-block:28px 20px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-stretch:118%;font-weight:750;font-size:clamp(28px,5.4vw,46px);line-height:1.02;margin:6px 0 6px;letter-spacing:-.01em;text-wrap:balance;color:var(--accent)}
h1 em{font-style:normal;color:inherit}
.credit{color:var(--muted);font-size:14px;margin:0}
.role{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.admin{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.prog .chip.ok{background:#2d8a55;color:#ffffff;border-color:#2d8a55;font-weight:700}
.save{font-size:12px;color:var(--muted);min-width:90px;text-align:right}

.stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding-block:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
.stat b{display:block;font-family:var(--f-display);font-stretch:110%;font-size:22px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:15px;height:15px;flex:none}

/* Liste */
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:16px 4px}
.month{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:12px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.venues{display:grid;gap:10px}
.venue{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s}
.venue:hover{border-color:var(--muted)}
.venue.past{opacity:.55}
.vdate{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.vdate .d{display:block;font-family:var(--f-display);font-stretch:105%;font-weight:750;font-size:30px;line-height:1}
.vdate .m{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vdate .lbl{display:block;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.vdate .lbl.alt{color:var(--muted);font-weight:500}
.vmain{min-width:0}
.vcity{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:20px;line-height:1.15}
.vsalle{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vreps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rep{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.vside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{width:84px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
@media (max-width:680px){
  .venue{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .vdate{padding-right:10px}.vdate .d{font-size:24px}
  .vside{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .quick{justify-content:flex-start}
}

/* États */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);margin-top:16px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;margin-top:12px}

/* Fiche lieu */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-top:20px}
.back:hover{color:var(--ink)}
.vhead{padding-block:14px 18px;display:grid;gap:4px}
.vhead .ville{font-family:var(--f-display);font-stretch:118%;font-weight:750;font-size:clamp(28px,6vw,44px);line-height:1.05;letter-spacing:-.01em}
.vhead .salle{font-size:17px;color:var(--muted)}
.vhead input.ville,.vhead input.salle{border:1px solid transparent;background:transparent;border-radius:6px;padding:0 4px;margin-left:-5px;width:100%}
.vhead input:hover{border-color:var(--line)}
.vhead input:focus{border-color:var(--accent);outline:none;background:var(--surface)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:8px}
@media (max-width:680px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .tl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .fname{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .none{font-size:14px;color:var(--muted)}
.tile.has{border-color:var(--accent-soft)}
.tfiles{display:grid;gap:6px}
.folder-in{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg);font-size:13px;min-width:0}
.folder-in:focus{border-color:var(--accent);outline:none}
.tfile{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;font-size:14px;font-weight:600;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);min-width:0}
.tfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tfile:hover{border-color:var(--muted)}
.tfile.first{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile .btn.ghost{justify-self:start;align-self:flex-start;padding-left:0}
.others{grid-column:1/-1;order:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.others .hint{margin-right:4px}

.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-block:10px 4px;border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav a{flex:none;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);padding:6px 11px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.secnav a:hover{background:var(--surface);color:var(--ink)}
.secnav .n{font-weight:500;font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.sec{scroll-margin-top:64px;padding-block:22px 6px}
.sec h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:20px;margin:0 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2 small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:680px){.fields{grid-template-columns:1fr}}
.field{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:10px;align-items:start;padding:9px 14px;border-bottom:1px solid var(--line);min-width:0}
.field.long{grid-column:1/-1;grid-template-columns:1fr}
.fields .field:nth-child(odd):not(.long){border-right:1px solid var(--line)}
@media (max-width:680px){.fields .field:nth-child(odd):not(.long){border-right:0}}
.field label{font-size:13px;color:var(--muted);padding-top:6px;display:flex;gap:7px;align-items:flex-start}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.field input[type=text],.field textarea{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;min-width:0}
.field textarea{resize:vertical;min-height:58px;field-sizing:content;line-height:1.45}
.field textarea.one{min-height:0;resize:none;overflow:hidden}
.tcw{display:grid;gap:6px;min-width:0}
.tfitem{display:grid;gap:3px;min-width:0}
.tdate{font-size:12px;color:var(--muted);padding-left:2px}
.tfile{position:relative}
.tfile[data-full]:hover::after,.tfile[data-full]:focus-visible::after{content:attr(data-full);position:absolute;left:0;top:calc(100% + 6px);z-index:30;max-width:min(420px,80vw);width:max-content;white-space:normal;word-break:break-word;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.35;padding:7px 10px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}

.crew{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin:4px 0 6px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.crewsel{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.crewval{font-size:14px;color:var(--ink);font-weight:700}.crewval.empty{color:var(--muted);font-weight:500}
.crewsel select{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--bg);font-size:14px;color:var(--ink);font-weight:600;min-width:120px}
.cdw{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:2px 0}
.cdw .tog{color:var(--ink);font-weight:600;font-size:14px}
.cdw .dot{margin-top:0}
.cdate{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.cdate input{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--bg)}

.tcw .tog{padding-left:7px}
.field input[type=text]:hover,.field textarea:hover{border-color:var(--line)}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.field input[readonly],.field textarea[readonly]{border-color:transparent!important;background:transparent!important}
.field.check{align-items:center}
.field.check label{padding-top:0}
.field.check .dot{margin-top:0}
.tog{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.val-warn{color:var(--warn)}

/* Rubriques repliables */
.foldbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.folds{display:grid;gap:8px}
.fold{--tint:var(--sunk);--tint-ink:var(--muted);background:var(--surface);border:1px solid var(--tint);border-radius:var(--r);scroll-margin-top:16px;overflow:hidden}
.fold[open]{border-color:var(--tint-ink)}
.fold[data-fold=dates]{--tint:var(--t-dates);--tint-ink:var(--ti-dates)}
.fold[data-fold=docs]{--tint:var(--t-docs);--tint-ink:var(--ti-docs)}
.fold[data-fold=general]{--tint:var(--t-general);--tint-ink:var(--ti-general)}
.fold[data-fold=transport]{--tint:var(--t-transport);--tint-ink:var(--ti-transport)}
.fold[data-fold=plateau]{--tint:var(--t-plateau);--tint-ink:var(--ti-plateau)}
.fold[data-fold=lumiere]{--tint:var(--t-lumiere);--tint-ink:var(--ti-lumiere)}
.fold[data-fold=son]{--tint:var(--t-son);--tint-ink:var(--ti-son)}
.fold[data-fold=video]{--tint:var(--t-video);--tint-ink:var(--ti-video)}
.fold[data-fold=habillage]{--tint:var(--t-habillage);--tint-ink:var(--ti-habillage)}
.fold[data-fold=contacts]{--tint:var(--t-contacts);--tint-ink:var(--ti-contacts)}
.fold>summary{background:var(--tint)}
.fold[open]>summary{border-radius:0;margin-bottom:12px}
.fold .ft::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tint-ink);margin-right:10px;vertical-align:1px}
.fold .chev{border-color:var(--tint-ink)}
.fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover{filter:brightness(.97)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fold>summary:hover{filter:brightness(1.15)}}
:root[data-theme="dark"] .fold>summary:hover{filter:brightness(1.15)}
.fold .ft{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:17px}
.fold .fs{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-variant-numeric:tabular-nums}
.fold .fs .n{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:600}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);justify-self:center;transition:transform .15s}
.fold[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.fold .fb{padding:0 12px 14px}
.fold .fb>.panel{border-color:var(--line)}

/* Tableaux */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.day{white-space:nowrap;font-weight:600}
td input{width:100%;min-width:76px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg)}
td input[type=date]{min-width:130px}
.preday td{background:var(--sunk)}
.ptag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--t-dates);color:var(--ti-dates);white-space:nowrap}
.repcell{color:var(--accent);font-weight:700}
.tfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.tfoot label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tfoot input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg)}

/* Contacts */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0}
.contact .fn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.contact .nm{font-weight:600}
.contact .ln{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;min-width:0}

    ["retours","HP plateau"],["hf","Micros HF"],["tech_hf","Technicien HF confirmé ?"],["intercom","Intercom"],

const ALLF = SECTIONS.flatMap(s => s.f.flatMap(([k,l,t,k2,l2]) => t === "textcheck" ? [{ k, l, t:"text" }, { k:k2, l:l2, t:"check" }] : t === "checkdate" ? [{ k, l, t:"check" }, { k:k2, l:l2, t:"date" }] : [{ k, l, t: t || "text" }]));

const KINDS = { planning:"Planning", plan_feu:"Plan de feu", calcul_video:"Calcul vidéo", fiche_tech:"Fiche technique & plans", autre:"Document" };
const UNSURE = /\?|à confirmer|a confirmer|à voir|en attente|à discuter|à préciser|à valider/i;

const S = { data:null, venues:new Map(), route:null, code:"", admin:false, who:"", err:"", ask:null, panel:null, lastLoad:0 };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
S.code = store.get("carmen-admin") || ""; S.who = store.get("carmen-who") || "";
let OPEN = new Set(); try { OPEN = new Set(JSON.parse(store.get("carmen-open") || "[]")); } catch {}

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
const fmt = (s, o) => { const d = pd(s); return d ? d.toLocaleDateString("fr-FR", o) : ""; };
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const sortedReps = v => (v.reps||[]).slice().sort((a,b) => a.d < b.d ? -1 : 1);
const firstDate = v => v.montage || sortedReps(v)[0]?.d || "9999-12-31";
const lastDate = v => { const r = sortedReps(v); return r.length ? r[r.length-1].d : v.montage || ""; };
const st = v => { if (v === true) return "ok"; if (v == null || v === "" || v === false) return ""; return UNSURE.test(String(v)) ? "warn" : "ok"; };
const isUrl = u => /^https?:\/\//i.test(u || "");
const API_URL = "https://script.google.com/macros/s/AKfycbyfaaTaZm7naT0S8yqtxz7Bk4twAGBOOalwtr5MM76cnFA3yUYlH5wnRC2ZFpsMF5wYIQ/exec";

};

/* ---------- Lecture du planning (onglet INFOS + onglets des villes) ---------- */
const P_MOIS = {janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
const pnorm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const pDMY = s => { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||""); return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : ""; };
const pLong = s => { const m = /(\d{1,2})\s+([a-zéû]+)\s+(\d{4})/i.exec(s||""); if (!m) return ""; const mo = P_MOIS[pnorm(m[2])]; return mo ? `${m[3]}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}` : ""; };
function tabDays(v) {
  const days = {}, MOM = { "matin":"matin", "apres midi":"am", "soir":"soir" }; let cur = null, last = null;
  for (const r of v) {
    const a = String(r[0]||"").trim(), b = String(r[1]||"").trim(), d = pLong(b);
    if (a && d && a === a.toUpperCase() && !/^\d/.test(a)) { cur = days[d] = { titre:a, matin:"", am:"", soir:"", dem:"", camion:"" }; last = null; continue; }
    if (!cur) continue;
    if (!a && !b) { last = null; continue; }
    const cam = /(\d{1,2}h\d{0,2})\s*:?\s*arriv[ée]e\s+(?:du\s+)?camion/i.exec(b) || /arriv[ée]e\s+(?:du\s+)?camion\D{0,12}?(\d{1,2}h\d{0,2})/i.exec(b);
    if (cam && !cur.camion) cur.camion = cam[1];
    const m = MOM[pnorm(a)]; if (m) { last = m; continue; }
    if (/^\d{1,2}h/.test(a) && !b && last) { cur[last] = a; last = null; continue; }
    if (/^\d{1,2}h/.test(a) && /d[ée]montage|chargement|camion/i.test(b)) { cur.dem = a; const c = /camion\D*?(\d{1,2}h\d{0,2})/i.exec(b); if (c) cur.camion = c[1]; }
  }
  return days;
}
function applyPlanning(d) {
  const raw = d.planningRaw; if (!raw || !raw.infos) return;
  const reps = {};
  for (const r of raw.infos) {
    const ville = String(r[5]||"").trim(), dd = pDMY(r[6]); if (!ville || !dd) continue;
    const h = [r[7], r[8]].map(x => String(x||"").trim()).filter(Boolean).join(" & ");
    (reps[pnorm(ville)] ||= []).push({ d:dd, h, matin:String(r[16]||"").trim(), am:String(r[24]||"").trim(), soir:String(r[25]||"").trim(), dem:String(r[26]||"").trim(), camion:String(r[27]||"").trim() });
  }
  const tabs = {}; for (const [name, v] of Object.entries(raw.tabs || {})) tabs[pnorm(name)] = v;
  for (const v of d.venues) {
    const n = pnorm(v.ville), list = (reps[n] || []).sort((a,b) => a.d < b.d ? -1 : 1), t = tabs[n];
    if (t) {
      const days = tabDays(t); list.forEach(r => { if (days[r.d]) { const { titre, ...hh } = days[r.d]; Object.assign(r, hh); } });
      const first = list.length ? list[0].d : "9999";
      v.preDays = Object.entries(days).filter(([dd, x]) => dd < first && !/EXPLOITATION|REPR[ÉE]SENTATION/.test(x.titre)).sort((a,b) => a[0] < b[0] ? -1 : 1).map(([dd, x]) => ({ d:dd, ...x }));
    }
    if (list.length || reps[n]) v.reps = list;
  }
}

/* ---------- Chargement ---------- */
async function load(first) {
  const slow = first ? setTimeout(() => { if (!S.data) { S.err = "Le serveur Google ne répond pas. Réessaie dans un instant ; si ça persiste, préviens Simon."; render(); } }, 25000) : 0;
  try {
    const d = await run("getData", S.code);
    clearTimeout(slow);
    if (!d || !d.venues) throw new Error("Le serveur a renvoyé une réponse vide (getData).");
    try { applyPlanning(d); } catch (e) { console.warn("planning", e); }
    S.data = d; S.err = ""; S.lastLoad = Date.now();
    S.venues = new Map(d.venues.map(v => [v.id, v]));
    if (S.code && !d.admin) { S.code = ""; store.set("carmen-admin", ""); }
    S.admin = !!d.admin;
    first ? render() : refresh();
  } catch (e) { clearTimeout(slow); S.err = errMsg(e); if (first || !S.data) render(); }
}
setInterval(() => { if (document.visibilityState === "visible" && !busyWriting()) load(false); }, 45000);

/* ---------- Enregistrement ---------- */
const Q = {}; let inflight = 0;

    const asking = S.ask === "doc:" + d.url;
    h += `<div class="doc"><span class="kind ${esc(d.kind)}">${esc(KINDS[d.kind] || "Document")}</span>
      <div style="min-width:0"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a><span class="meta">${d.fileId ? "Fichier Drive" : "Lien"}${d.at ? " · " + esc(new Date(d.at).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})) : ""}</span></div>
      ${asking ? `<span class="confirm">Supprimer ? <button class="btn small danger" data-act="del-doc-yes" data-url="${esc(d.url)}">Oui</button><button class="btn small" data-act="cancel">Non</button></span>` : `<button class="btn small ghost" data-act="del-doc" data-url="${esc(d.url)}">Supprimer</button>`}</div>`;
  }
  return h + `</div><div class="adddoc">
    <div class="r"><select id="up-kind" aria-label="Type de document">${Object.entries(KINDS).map(([k,l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select>
      <button class="btn primary" data-act="upload">${ICON.up} Déposer des fichiers</button><span class="hint">PDF ou images. Le planning doit être un PDF.</span></div>
    <div class="r"><input id="lnk-url" type="url" placeholder="…ou colle un lien Drive" aria-label="Lien"><input id="lnk-name" type="text" placeholder="Nom affiché" aria-label="Nom affiché"><button class="btn" data-act="add-link">Ajouter le lien</button></div></div>`;
}
function contactsHTML(cs) {
  let h = `<div class="contacts">`;
  cs.forEach((c, i) => h += `<div class="contact" data-contact>
    <div class="row2"><input id="c-fn-${i}" data-ck="fonction" value="${esc(c.fonction)}" placeholder="Fonction (DT, RL…)" aria-label="Fonction"><input id="c-nm-${i}" data-ck="nom" value="${esc(c.nom)}" placeholder="Nom" aria-label="Nom"></div>
    <div class="ln"><input id="c-ml-${i}" data-ck="mail" value="${esc(c.mail)}" placeholder="Mail" aria-label="Mail">${c.mail ? `<button class="copy" data-copy="${esc(c.mail)}">Copier</button>` : ""}</div>
    <div class="ln"><input id="c-tl-${i}" data-ck="tel" value="${esc(c.tel)}" placeholder="Téléphone" aria-label="Téléphone">${c.tel ? `<button class="copy" data-copy="${esc(c.tel)}">Copier</button>` : ""}</div>
    <input id="c-nt-${i}" data-ck="notes" value="${esc(c.notes)}" placeholder="Notes" aria-label="Notes">
    ${S.admin ? `<div><button class="btn small ghost" data-act="rm-contact">Retirer</button></div>` : ""}</div>`);
  return h + `</div><div style="margin-top:10px"><button class="btn small" data-act="add-contact">${ICON.plus} Ajouter un contact</button></div>`;
}
function histHTML(v) {
  const hs = histOf(v).slice(0, 60);
  if (!hs.length) return `<div class="doc"><span class="hint">Aucune modification pour l'instant.</span></div>`;
  return `<div class="scroll"><table><thead><tr><th>Quand</th><th>Qui</th><th>Info</th><th>Nouvelle valeur</th></tr></thead><tbody>${hs.map(x => `<tr><td class="mono" style="white-space:nowrap">${esc(new Date(x.t).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</td><td>${esc(x.qui)}</td><td>${esc(LABEL[x.info] || x.info)}</td><td>${esc(x.apres === "true" ? "Oui" : x.apres === "false" ? "Non" : x.apres)}</td></tr>`).join("")}</tbody></table></div>`;
}
function delHTML(v) {
  return S.ask === "venue" ? `<span>Supprimer ${esc(v.ville)} et sa fiche ? Si la ville est encore dans le planning, elle reviendra vide.</span><span class="confirm"><button class="btn small danger" data-act="del-venue-yes">Supprimer</button><button class="btn small" data-act="cancel">Annuler</button></span>`
    : `<span>Retirer ce lieu de la tournée</span><button class="btn small danger" data-act="del-venue">Supprimer le lieu</button>`;
}
window.__ok2 = true;
</script>

<script>
"use strict";
/* ---------- Mise à jour ciblée ---------- */
function patchBlock(name, html) { const el = view.querySelector(`[data-block="${name}"]`); if (el && !el.contains(document.activeElement)) el.innerHTML = html; }
function refresh() {
  renderRole();
  if (!S.route) { if (!view.querySelector("form")) render(); return; }
  const v = S.venues.get(S.route); if (!v) { render(); return; }
  patchBlock("tiles", tilesHTML(v)); patchBlock("crew", crewHTML()); patchBlock("reps", repsHTML(v)); patchBlock("hist", histHTML(v)); patchBlock("lumcheck", lumBoxHTML(v));
  if (S.admin && !S.ask) patchBlock("docs", docsHTML(v));
  if (!Q["c|" + v.id]) patchBlock("contacts", contactsHTML(v.contacts));
  for (const sid of FOLD_IDS) { const el = view.querySelector(`[data-block="sum-${sid}"]`); if (el) el.innerHTML = sumHTML(sid, v); }
  view.querySelectorAll("[data-k]").forEach(el => {
    if (el === document.activeElement || Q[v.id + "|" + el.dataset.k]) return;
    const val = v.f[el.dataset.k];
    if (el.type === "checkbox") { el.checked = val === true; if (!el.dataset.fixed) el.nextSibling.textContent = val === true ? "Oui" : "Non"; }
    else if (el.value !== String(val ?? "")) { el.value = val ?? ""; grow(el); }
    setDot(el);
  });
}
function setDot(el) { const d = el.closest(".field")?.querySelector(".dot"); if (d) d.className = "dot " + st(el.type === "checkbox" ? el.checked : el.value); }
function readContacts() { return [...view.querySelectorAll("[data-contact]")].map(c => { const o = {}; c.querySelectorAll("[data-ck]").forEach(i => o[i.dataset.ck] = i.value.trim()); return o; }); }

/* ---------- Événements ---------- */
view.addEventListener("input", e => {
  const el = e.target, id = S.route; if (!id) return;
  if (el.dataset.k) {
    const val = el.type === "checkbox" ? el.checked : el.value;
    if (el.type === "checkbox" && !el.dataset.fixed) el.nextSibling.textContent = val ? "Oui" : "Non";
    setDot(el); queueField(id, el.dataset.k, val);
  } else if (el.dataset.ck) queueContacts(id);
});
view.addEventListener("change", async e => {
  const el = e.target, id = S.route; if (!id || !S.admin) return;
  if (el.id === "in-ftfolder") {
    const url = el.value.trim();
    if (url && !isUrl(url)) { toast("Colle un lien qui commence par https://"); return; }
    try { await run("adminSetFolder", S.code, id, url); S.venues.get(id).ftFolder = url; toast(url ? "Dossier Drive enregistré." : "Dossier retiré."); el.blur(); patchBlock("tiles", tilesHTML(S.venues.get(id))); }
    catch (err) { toast(errMsg(err)); }
  }
  if (el.id === "in-montage") { try { await run("adminSetMontage", S.code, id, el.value); toast("Date de montage enregistrée."); load(false); } catch (err) { toast(errMsg(err)); } }
});
const NATIVE_GROW = !!(window.CSS && CSS.supports && CSS.supports("field-sizing", "content"));
function grow(el) { if (NATIVE_GROW || !el || el.tagName !== "TEXTAREA" || !el.closest(".field") || !el.offsetParent) return; el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
function growAll(root) { if (NATIVE_GROW) return; (root || view).querySelectorAll(".field textarea").forEach(grow); }
view.addEventListener("input", e => grow(e.target));
view.addEventListener("toggle", e => { if (e.target.open) growAll(e.target); }, true);
new MutationObserver(() => growAll()).observe(view, { childList:true, subtree:true });
window.addEventListener("resize", () => growAll());
view.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.fold) return;
  d.open ? OPEN.add(d.dataset.fold) : OPEN.delete(d.dataset.fold); store.set("carmen-open", JSON.stringify([...OPEN]));
  const b = view.querySelector('[data-act="fold-all"]'); if (b) b.textContent = allOpen() ? "Tout replier" : "Tout déplier";
}, true);
document.addEventListener("submit", async e => {
  if (e.target.id !== "venue-form") return;
  e.preventDefault();
  const ville = $("#nv-ville").value.trim(), salle = $("#nv-salle").value.trim(); if (!ville) return;
  try { const r = await run("adminAddVenue", S.code, ville, salle); S.ask = null; await load(false); go(r.id); } catch (err) { toast(errMsg(err)); }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-go],[data-copy],[data-stop]"); if (!t) return;
  if (t.hasAttribute("data-stop")) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = "Copié"; setTimeout(() => t.textContent = "Copier", 1500); } catch { toast(t.dataset.copy); } return; }
  const act = t.dataset.act, id = S.route, v = id && S.venues.get(id);
  switch (act) {
    case "home": e.preventDefault(); go(null); break;
    case "reload": S.err = ""; render(); load(true); break;
    case "who": S.panel = { type:"who" }; renderPanel(); $("#who-in")?.focus(); break;
    case "login": S.panel = { type:"login" }; renderPanel(); $("#code-in")?.focus(); break;
    case "logout": S.code = ""; store.set("carmen-admin", ""); S.admin = false; render(); break;
    case "panel-close": S.panel = null; renderPanel(); break;
    case "fold-all": { const open = !allOpen(); view.querySelectorAll("details.fold").forEach(d => d.open = open); break; }
    case "add-contact": { const cs = readContacts(); cs.push({ fonction:"", nom:"", mail:"", tel:"", notes:"" }); const el = view.querySelector('[data-block="contacts"]'); el.innerHTML = contactsHTML(cs); el.querySelector(`#c-fn-${cs.length-1}`)?.focus(); break; }
    case "rm-contact": t.closest("[data-contact]").remove(); queueContacts(id); break;
    case "add-venue": S.ask = "add-venue"; render(); $("#nv-ville")?.focus(); break;
    case "cancel": S.ask = null; render(); break;
    case "up-kind": case "upload": { const inp = $("#file-up"); inp.dataset.kind = act === "upload" ? ($("#up-kind")?.value || "autre") : t.dataset.kind; inp.value = ""; inp.click(); break; }
    case "add-link": {
      const url = $("#lnk-url").value.trim(), name = $("#lnk-name").value.trim(), kind = $("#up-kind")?.value || "autre";
      if (!isUrl(url)) { toast("Colle un lien qui commence par https://"); return; }
      try {
        if (kind === "fiche_tech") { await run("adminSetFolder", S.code, id, url); toast("Dossier Drive enregistré."); }
        else { await run("adminAddLink", S.code, id, kind, name || KINDS[kind], url); toast("Lien ajouté."); }
        await load(false); patchBlock("docs", docsHTML(S.venues.get(id)));
      } catch (err) { toast(errMsg(err)); }
      break;
    }
    case "del-doc": S.ask = "doc:" + t.dataset.url; patchBlock("docs", docsHTML(v)); break;
    case "del-doc-yes": { S.ask = null; try { await run("adminDeleteDoc", S.code, id, t.dataset.url); toast("Document supprimé."); await load(false); patchBlock("docs", docsHTML(S.venues.get(id))); } catch (err) { toast(errMsg(err)); } break; }
    case "del-venue": S.ask = "venue"; view.querySelector('[data-block="del"]').innerHTML = delHTML(v); break;
    case "del-venue-yes": try { await run("adminDeleteVenue", S.code, id); toast(`${v.ville} supprimé.`); await load(false); go(null); } catch (err) { toast(errMsg(err)); } break;
  }
});
document.addEventListener("keydown", e => { const t = e.target; if ((e.key === "Enter" || e.key === " ") && t.dataset && t.dataset.go) { e.preventDefault(); go(t.dataset.go); } });
$("#file-up").addEventListener("change", async e => {
  const files = [...e.target.files], kind = e.target.dataset.kind || "autre", id = S.route; if (!id) return;
  for (const f of files) {
    if (kind === "planning" && f.type !== "application/pdf") { toast(`« ${f.name} » : le planning doit être un PDF.`); continue; }
    if (f.size > 25 * 1048576) { toast(`« ${f.name} » est trop lourd (25 Mo max).`); continue; }
    saveState(`Envoi de ${f.name}…`);
    try {
      const b64 = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(f); });
      await run("adminUpload", S.code, id, kind, f.name, f.type || "application/octet-stream", b64);
      saveState("Enregistré");
    } catch (err) { toast(`« ${f.name} » : ` + errMsg(err)); saveState(""); }
  }
  await load(false); const v = S.venues.get(id); if (v) { patchBlock("tiles", tilesHTML(v)); patchBlock("docs", docsHTML(v)); }
});

render(); load(true);
window.__ok3 = true;
</script>

<script>
(function () {
  var miss = [1, 2, 3].filter(function (n) { return !window["__ok" + n]; });
  if (!miss.length) return;
  var v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="empty"><strong>Page incomplète</strong>Recharge la page. Parties manquantes : ' + miss.map(function (n) { return "Script" + n; }).join(", ") + '<br><span class="hint"></span></div>';
})();
</script>
